[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "affectdyn"
version = "0.1.0"
description = "Frozen-feature evaluation of facial affect dynamics"
readme = "README.md"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
include = ["affectdyn*"]
